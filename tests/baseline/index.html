<p class="px-4 pb-5 text-[13px] leading-relaxed text-ink-300 sm:px-5 sm:pb-6 sm:text-sm md:px-7 md:text-base">Sí. El N52 es el grado más alto de imán neodimio que se vende. Aguanta hasta 500g sin moverse — eso incluye un iPhone 15 Pro Max o un Samsung S24 Ultra con funda. Lo probaron miles de clientes en Argentina, en autos de calle y en rutas de tierra.</p>

<div class="grid overflow-hidden transition-[grid-template-rows] duration-300 grid-rows-[0fr]">

<p class="px-4 pb-5 text-[13px] leading-relaxed text-ink-300 sm:px-5 sm:pb-6 sm:text-sm md:px-7 md:text-base">Sí. El soporte es compatible con MagSafe: si tu iPhone tiene MagSafe nativo (como el iPhone 12 y posteriores), lo colocás directamente y queda fijo al instante. Si tu celular no cuenta con MagSafe, en el kit viene incluido un aro metálico adhesivo que pegás en el back de tu celu o de la funda, y a partir de ahí funciona igual. Recomendamos que la funda sea compatible con MagSafe para la mejor adherencia.</p>
